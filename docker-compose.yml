version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pms_postgres
    environment:
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: pms_password
      POSTGRES_DB: pms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: pms_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pms_db
      - SPRING_DATASOURCE_USERNAME=pms_user
      - SPRING_DATASOURCE_PASSWORD=pms_password
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: pms_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pm_redis_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
